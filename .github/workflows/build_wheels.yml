name: Build OpenCV 5.x GStreamer Windows Wheels

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows_wheels:
    name: Build wheels on Windows
    runs-on: windows-2025

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4

      # Захищений метод збирання адрес у PowerShell
      - name: Clone OpenCV Core and Contrib
        shell: powershell
        run: |
          $Domain = "github.com"
          $CoreRepo = "opencv/opencv.git"
          $ContribRepo = "opencv/opencv_contrib.git"
          
          $UrlCore = "https://" + $Domain + "/" + $CoreRepo
          $UrlContrib = "https://" + $Domain + "/" + $ContribRepo
          
          git clone --depth 1 --branch 5.x $UrlCore opencv_source
          git clone --depth 1 --branch 5.x $UrlContrib opencv_contrib

      # ВИНЕСЕНЕ ВИПРАВЛЕННЯ: використовуємо надійне рекурсивне копіювання злиття папок
      - name: Prepare Root Directory for Build
        shell: powershell
        run: |
          Copy-Item -Path opencv_source\* -Destination . -Recurse -Force
          Remove-Item -Path opencv_source -Recurse -Force

      - name: Install GStreamer (Windows)
        shell: powershell
        run: |
          choco install gstreamer -y
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64\" >> $env:GITHUB_ENV
          echo "C:\gstreamer\1.0\msvc_x86_64\bin" >> $env:GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel build

      - name: Build wheels via cibuildwheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BEFORE_BUILD: "pip install numpy ninja cmake scikit-build"
          CIBW_ENVIRONMENT: >
            CMAKE_ARGS="-DWITH_GSTREAMER=ON
            -DOPENCV_EXTRA_MODULES_PATH=../opencv_contrib/modules
            -DBUILD_EXAMPLES=OFF
            -DBUILD_opencv_apps=OFF
            -DBUILD_opencv_world=ON
            -G Ninja"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencv-5.x-gstreamer-windows-wheels
          path: ./wheelhouse/*.whl
