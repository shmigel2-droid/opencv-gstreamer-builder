name: Fast Pack Extracted PYD to Wheel

on:
  workflow_dispatch:

jobs:
  pack_wheel:
    name: Pack Wheel from Ready Binary
    runs-on: windows-2025

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4

      - name: Build Wheel Package from Local File
        shell: powershell
        run: |
          mkdir dist_wheel/cv2
          
          if (Test-Path "cv2.pyd") {
              Copy-Item -Path "cv2.pyd" -Destination dist_wheel/cv2/cv2.pyd -Force
              Write-Output "Binary file found and moved successfully."
          } else {
              Write-Error "Critical error: cv2.pyd not found in the root directory!"
              exit 1
          }
          
          echo "from .cv2 import *" > dist_wheel/cv2/__init__.py
          Copy-Item -Path setup.py -Destination dist_wheel/
          Copy-Item -Path pyproject.toml -Destination dist_wheel/
          
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel
          
          cd dist_wheel
          python -m build --wheel --outdir ../wheelhouse

      - name: Upload Ready Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencv-5.x-windows-ready-wheel
          path: ./wheelhouse/*.whl
          if-no-files-found: error
