name: Build OpenCV 5.x GStreamer Wheels

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4

      # Захищене клонування: передаємо параметри через окремі текстові змінні хмари
      - name: Clone OpenCV 5.x source safely
        env:
          GH_HOST: "github.com"
          OC_REPO: "opencv/opencv.git"
          CB_REPO: "opencv/opencv_contrib.git"
        run: |
          git clone --depth 1 --branch 5.x "https://${GH_HOST}/${OC_REPO}" opencv
          git clone --depth 1 --branch 5.x "https://${GH_HOST}/${CB_REPO}" opencv_contrib

      - name: Install GStreamer and Build Deps (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgtk-3-dev

      - name: Install GStreamer (Windows)
        if: matrix.os == 'windows-2025'
        shell: powershell
        run: |
          choco install gstreamer -y
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64\" >> $env:GITHUB_ENV
          echo "C:\gstreamer\1.0\msvc_x86_64\bin" >> $env:GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel build

      - name: Build wheels via cibuildwheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT: >
            CMAKE_ARGS="-DWITH_GSTREAMER=ON
            -DOPENCV_EXTRA_MODULES_PATH=../opencv_contrib/modules
            -DBUILD_EXAMPLES=OFF
            -DBUILD_opencv_apps=OFF
            -DBUILD_opencv_world=ON"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencv-5.x-gstreamer-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
