name: Build OpenCV 5.x GStreamer Windows Wheels

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows_wheels:
    name: Build wheels on Windows
    runs-on: windows-2025

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4

      - name: Clone OpenCV Core
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          ref: 5.x
          path: opencv
          fetch-depth: 1

      - name: Clone OpenCV Contrib
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv_contrib
          ref: 5.x
          path: opencv_contrib
          fetch-depth: 1

      - name: Install GStreamer (Windows)
        shell: cmd
        run: |
          choco install gstreamer -y
          echo GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64\>> %GITHUB_ENV%
          echo C:\gstreamer\1.0\msvc_x86_64\bin>> %GITHUB_PATH%

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy ninja cmake setuptools wheel build scikit-build

      - name: Compile OpenCV via CMake
        shell: powershell
        run: |
          mkdir opencv/build
          cd opencv/build
          cmake -G "Ninja" `
            -D CMAKE_BUILD_TYPE=RELEASE `
            -D WITH_GSTREAMER=ON `
            -D OPENCV_EXTRA_MODULES_PATH=../../opencv_contrib/modules `
            -D BUILD_EXAMPLES=OFF `
            -D BUILD_opencv_apps=OFF `
            -D BUILD_opencv_world=ON `
            -D PYTHON3_EXECUTABLE=(Get-Command python).Source `
            ..
          ninja

      # ВИПРАВЛЕНО: Пряме копіювання через рекурсивний пошук шляху без жодних змінних
      - name: Build Wheel Package
        shell: powershell
        run: |
          mkdir dist_wheel/cv2
          
          # Надійно знаходимо та копіюємо pyd-файл за маскою, обходячи будь-які папки
          Get-ChildItem -Path opencv/build -Filter "cv2*.pyd" -Recurse | Copy-Item -Destination dist_wheel/cv2/cv2.pyd -Force
          
          echo "from .cv2 import *" > dist_wheel/cv2/__init__.py
          Copy-Item -Path setup.py -Destination dist_wheel/
          Copy-Item -Path pyproject.toml -Destination dist_wheel/
          cd dist_wheel
          python -m build --wheel --outdir ../wheelhouse

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencv-5.x-gstreamer-windows-wheels
          path: ./wheelhouse/*.whl
