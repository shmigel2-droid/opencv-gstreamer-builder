name: Build OpenCV 5.x STATIC + GStreamer Bundle

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows_bundle:
    name: Build Bundle on Windows
    runs-on: windows-2025

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4

      - name: Clone OpenCV Core
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          ref: 5.x
          path: opencv
          fetch-depth: 1

      - name: Clone OpenCV Contrib
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv_contrib
          ref: 5.x
          path: opencv_contrib
          fetch-depth: 1

      - name: Install GStreamer (Windows)
        shell: cmd
        run: |
          choco install gstreamer -y
          echo GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64\>> %GITHUB_ENV%
          echo C:\gstreamer\1.0\msvc_x86_64\bin>> %GITHUB_PATH%

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy ninja cmake setuptools wheel build scikit-build

      - name: Compile OpenCV via CMake
        shell: powershell
        run: |
          mkdir opencv/build
          cd opencv/build
          
          cmake -G "Ninja" `
            -D CMAKE_BUILD_TYPE=RELEASE `
            -D WITH_GSTREAMER=ON `
            -D OPENCV_EXTRA_MODULES_PATH=../../opencv_contrib/modules `
            -D BUILD_EXAMPLES=OFF `
            -D BUILD_opencv_apps=OFF `
            -D BUILD_SHARED_LIBS=OFF `
            -D BUILD_opencv_world=ON `
            -D BUILD_opencv_python3=ON `
            -D OPENCV_FORCE_PYTHON_LIBS=ON `
            -D PYTHON3_EXECUTABLE="$env:pythonLocation\python.exe" `
            ..
          ninja

      # ВИПРАВЛЕНО: Пряме копіювання за масками шляхів без жодних змінних та дужок
      - name: Prepare Portable Directory Bundle
        shell: powershell
        run: |
          # 1. Створюємо фінальну папку cv2
          mkdir bundle_output/cv2
          
          # 2. Переносимо туди скомпільовану статичну OpenCV
          Get-ChildItem -Path opencv/build -Filter "cv2*.pyd" -Recurse | Copy-Item -Destination bundle_output/cv2/cv2.pyd -Force
          
          # 3. Копіюємо DLL-ки з усіх можливих шляхів встановлення Chocolatey в один рядок
          Copy-Item -Path C:\tools\gstreamer\*\msvc_x86_64\bin\*.dll -Destination bundle_output/cv2/ -Force -ErrorAction SilentlyContinue
          Copy-Item -Path C:\gstreamer\*\msvc_x86_64\bin\*.dll -Destination bundle_output/cv2/ -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "C:\Program Files\gstreamer\*\msvc_x86_64\bin\*.dll" -Destination bundle_output/cv2/ -Force -ErrorAction SilentlyContinue
          
          # 4. Створюємо файл ініціалізації для автоматичного імпорту вбудованих DLL
          \$InitContent = @'
          import os
          import sys
          current_dir = os.path.dirname(__file__)
          if sys.platform == "win32" and os.path.exists(current_dir):
              os.add_dll_directory(current_dir)
          from .cv2 import *
          '@
          Set-Content -Path bundle_output/cv2/__init__.py -Value \$InitContent

      - name: Upload Full Portable Bundle
        uses: actions/upload-artifact@v4
        with:
          name: opencv-5.x-gstreamer-PORTABLE-bundle-py312
          path: ./bundle_output/cv2/
          if-no-files-found: error
