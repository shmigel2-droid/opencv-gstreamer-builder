name: Build OpenCV 5.x GStreamer Windows Wheels

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows_wheels:
    name: Build wheels on Windows
    runs-on: windows-2025

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4

      - name: Clone OpenCV Core
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          ref: 5.x
          path: opencv
          fetch-depth: 1

      - name: Clone OpenCV Contrib
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv_contrib
          ref: 5.x
          path: opencv_contrib
          fetch-depth: 1

      - name: Install GStreamer (Windows)
        shell: cmd
        run: |
          choco install gstreamer -y
          echo GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64\>> %GITHUB_ENV%
          echo C:\gstreamer\1.0\msvc_x86_64\bin>> %GITHUB_PATH%

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy ninja cmake setuptools wheel build scikit-build

      - name: Compile OpenCV via CMake
        shell: powershell
        run: |
          mkdir opencv/build
          cd opencv/build
          
          # Отримуємо точні шляхи до хмарного Python для передачі в CMake
          \$PythonExe = (Get-Command python).Source
          \$PythonLib = "(env:pythonLocation)\libs\python311.lib"
          \$PythonInc = "(env:pythonLocation)\include"
          
          # Запускаємо CMake з ПРИМУСОВИМИ прапорцями збірки Python
          cmake -G "Ninja" `
            -D CMAKE_BUILD_TYPE=RELEASE `
            -D WITH_GSTREAMER=ON `
            -D OPENCV_EXTRA_MODULES_PATH=../../opencv_contrib/modules `
            -D BUILD_EXAMPLES=OFF `
            -D BUILD_opencv_apps=OFF `
            -D BUILD_opencv_world=ON `
            -D BUILD_opencv_python3=ON `
            -D OPENCV_FORCE_PYTHON_LIBS=ON `
            -D PYTHON3_EXECUTABLE=$PythonExe `
            -D PYTHON3_LIBRARY=\$PythonLib `
            -D PYTHON3_INCLUDE_DIR=$PythonInc `
            ..
          ninja

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencv-5.x-windows-pyd-binary
          path: opencv/build/**/cv2*.pyd
          if-no-files-found: error
